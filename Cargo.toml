[package]
name = "rmk-keyboard-madula"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmk = { version = "=0.9.0", default-features = false, features = ["usb_log", "storage", "watchdog", "nrf52840_ble", "split", "async_matrix", "adafruit_bl"] }
# Limit USB log traffic even in optimized diagnostic builds.
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
nrf-sdc = { version = "0.4.0", features = ["defmt", "peripheral", "central", "nrf52840"] }
nrf-mpsl = { version = "0.4.0", features = ["defmt", "critical-section-impl", "nrf52840"] }
bt-hci = { version = "0.10", features = ["defmt"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "nfc-pins-as-gpio", "time"] }
embassy-executor = { version = "0.10", features = ["defmt", "platform-cortex-m", "executor-thread"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { package = "madula-boot-panic", path = "diagnostics/boot-panic" }
static_cell = "2"
embassy-usb-logger = { version = "0.6.0", features = ["nrf52840-adafruit-reset"] }

[features]
boot-audit = ["panic-probe/boot-recovery"]

[patch.crates-io]
embassy-usb-logger = { path = "vendor/embassy-usb-logger" }

[[bin]]
name = "madula-central"
path = "src/central.rs"
[[bin]]
name = "cornix-left"
path = "src/left.rs"
[[bin]]
name = "cornix-right"
path = "src/right.rs"

[[bin]]
name = "xiao-ble-init"
path = "diagnostics/ble-init.rs"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
lto = "fat"
