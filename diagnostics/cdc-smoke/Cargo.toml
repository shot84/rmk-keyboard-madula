[package]
name = "xiao-cdc-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-nrf = { version = "0.11", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
embassy-usb-logger = { path = "../../vendor/embassy-usb-logger", features = ["nrf52840-adafruit-reset"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
log = "0.4"

[profile.release]
opt-level = "z"
lto = true
debug = true
