[behavior.morse]
prior_idle_time = "150ms"
[behavior.morse.profiles.lt]
permissive_hold = true
hold_timeout = "200ms"
[behavior.morse.profiles.mt]
permissive_hold = true
hold_timeout = "280ms"
quick_tap_timeout = "175ms"
enable_flow_tap = true
[behavior.morse.profiles.t150]
hold_timeout = "150ms"
[[behavior.morse.morses]]
profile = "t150"
hold = "MO(2)"
double_tap = "WM(Space, LGui)"

[storage]
start_addr = 0xE0000
num_sectors = 16

[host]
# Keymap editing from Vial (vial.rocks or the Vial app); layout in vial.json.
vial_enabled = true

[ble]
enabled = true

[rmk]
split_peripherals_num = 2

# RMK 0.9: each BLE link and PeripheralManager subscribes to sleep state.
# Two peripherals need four slots, including when display is disabled.
# The feature defaults add two slots; reserve the other two here.
[event.sleep_state]
subs = 2

# LED monitor in addition to both split peripheral managers.
[event.layer_change]
subs = 2
[event.connection_status_change]
subs = 2
[event.led_indicator]
subs = 3

# Radial controller action consumer (User 20/21 rotation, 22 button).
[event.action]
subs = 1

[split]
connection = "ble"

[split.central]
rows = 1
cols = 3
row_offset = 4
col_offset = 0

[split.central.matrix]
matrix_type = "direct_pin"
direct_pin_low_active = true
direct_pins = [["P0_04", "P0_05", "P1_11"]]

[[split.peripheral]]
rows = 4
cols = 7
row_offset = 0
col_offset = 0

[split.peripheral.matrix]
matrix_type = "normal"
row2col = false
row_pins = ["P0_30", "P0_31", "P0_29", "P0_02"]
col_pins = ["P0_28", "P0_03", "P1_10", "P1_11", "P1_13", "P0_09", "P0_10"]

# Left EC11, global encoder ID 0. Match ZMK pull-ups and 80/20 resolution.
[[split.peripheral.input_device.encoder]]
pin_a = "P1_04"
pin_b = "P1_06"
internal_pullup = true
phase = "resolution"
resolution = 4
reverse = false

[[split.peripheral]]
rows = 4
cols = 7
row_offset = 0
col_offset = 7

[split.peripheral.matrix]
matrix_type = "normal"
row2col = false
row_pins = ["P1_09", "P0_28", "P0_03", "P1_10"]
col_pins = ["P0_30", "P0_31", "P0_29", "P0_02", "P1_13", "P0_10", "P0_09"]

# Right Cornix EC11: same pins/pull-ups as ZMK; 80 steps / 20 triggers = 4.
# Right follows left, so its global encoder ID is 1.
[[split.peripheral.input_device.encoder]]
pin_a = "P1_04"
pin_b = "P1_06"
internal_pullup = true
phase = "resolution"
resolution = 4
reverse = false
