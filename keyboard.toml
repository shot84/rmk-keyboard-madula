Tab A S D F G H J K L Minus Enter
LShift Z X C V B No User22 N M Comma Dot Up LT(7, Slash, lt)
LCtrl LAlt LShift MT(Language2, LGui, mt) LT(4, Space, lt) LT(6, Language1, lt) Backspace LT(5, Enter, lt) TD(0) Left Down Right
MouseBtn1 MouseBtn3 MouseBtn2
MouseBtn1 MouseBtn2 MouseBtn3 MouseWheelUp MouseWheelDown MouseWheelLeft MouseWheelRight WM(Up, LCtrl) WM(Down, LCtrl) WM(Right, LCtrl) WM(Left, LCtrl)
"""

[[keymap.layer]]
