name: Firmware release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [cornix-left, cornix-right, madula-lpps, madula-tb, madula-iqs]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libclang-dev
          rustup toolchain install 1.94.1 --profile minimal --target thumbv7em-none-eabihf
      - name: Tests
        run: |
          python3 -m unittest discover -s tests
          rustc +1.94.1 --test src/lpps_motion.rs -o /tmp/lpps-tests
          /tmp/lpps-tests
          rustc +1.94.1 --test src/battery_voltage.rs -o /tmp/battery-tests
          /tmp/battery-tests
          rustc +1.94.1 --test src/iqs9151_gestures.rs -o /tmp/iqs-tests
          /tmp/iqs-tests
          rustc +1.94.1 --test src/peripheral_led_pattern.rs -o /tmp/led-tests
          /tmp/led-tests
          rustc +1.94.1 --test src/ws2812_pwm_frame.rs -o /tmp/pwm-tests
          /tmp/pwm-tests
          rustc +1.94.1 --test src/radial_report.rs -o /tmp/dial-tests
          /tmp/dial-tests
      - name: Build and package
        env:
          CC_thumbv7em_none_eabihf: arm-none-eabi-gcc
          AR_thumbv7em_none_eabihf: arm-none-eabi-ar
        run: bash scripts/build-release.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.uf2 *.elf *.json > SHA256SUMS
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease \
            --title "RMK Madula $RELEASE_TAG" --notes-file docs/release-notes.md
